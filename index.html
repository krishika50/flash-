<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* पूरा बैकग्राउंड एकदम डार्क/काला करने के लिए */
        body { background-color: #0f172a; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 20px; }
        
        /* मुख्य हेडिंग का रंग सफेद करने के लिए */
        h1 { font-size: 2.5rem; color: #f8fafc; margin-bottom: 5px; }
        
        /* डिस्क्रिप्शन का रंग */
        .desc { color: #94a3b8; font-style: italic; margin-bottom: 20px; text-align: center; font-size: 1rem; }
        
        /* चैट कंटेनर को डार्क और प्रीमियम लुक देने के लिए */
        #chatContainer { width: 100%; max-width: 600px; height: 450px; background: #1e293b; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; margin-bottom: 15px; border: 1px solid #334155; }
        
        /* मैसेजेस के बबल्स की स्टाइलिंग */
        .message { max-width: 75%; padding: 12px 16px; border-radius: 12px; font-size: 1rem; line-height: 1.5; word-wrap: break-word; }
        
        /* यूजर का मैसेज बबल (नीला) */
        .user-message { background-color: #3b82f6; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        
        /* एआई (Flash) के जवाब वाले बॉक्स का रंग (डार्क ग्रे) */
        .ai-message { background-color: #334155; color: #f8fafc; align-self: flex-start; border-bottom-left-radius: 2px; }
        
        /* इनपुट एरिया */
        .input-area { width: 100%; max-width: 600px; display: flex; gap: 10px; }
        
        /* इनपुट बॉक्स को भी डार्क थीम में बदलने के लिए */
        #userInput { flex: 1; padding: 14px; border: 1px solid #475569; border-radius: 12px; font-size: 1rem; outline: none; transition: border 0.2s; background: #1e293b; color: white; }
        #userInput:focus { border-color: #3b82f6; }
        
        /* सेंड बटन की स्टाइल */
        #sendBtn { background-color: #3b82f6; color: white; border: none; padding: 0 24px; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        #sendBtn:hover { background-color: #2563eb; }
    </style>
</head>
<body>

    <!-- आपका नया ब्रांड नाम -->
    <h1>Flash</h1>
    
    <!-- आपका सिलेक्ट किया हुआ क्यूट Gen Z डिस्क्रिप्शन -->
    <p class="desc">Your last-minute savior. Catching vibes and answers in a flash! ⚡✨</p>

    <!-- चैट बॉक्स जहाँ बातचीत दिखेगी -->
    <div id="chatContainer">
        <div class="message ai-message">Hey! मैं Flash हूँ। बताओ आज क्या बवाल मचाना है? 😉</div>
    </div>

    <!-- सवाल पूछने वाला बॉक्स और सेंड बटन -->
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Flash से कुछ भी पूछें..." onkeydown="if(event.key === 'Enter') sendMessage()">
        <button id="sendBtn" onclick="sendMessage()">Send</button>
    </div>

    <script>
        // 1. यहाँ अपनी नई 'AQ' से शुरू होने वाली असली API Key कोट्स "" के बीच पेस्ट करें
        const API_KEY ="AQ.Ab8RN6IhmUyoz4F2-YT6fhhYY3SXdH72O9DLNy7x9S593f2kIg;

        // 2. नए Gemini-1.5-Flash मॉडल के लिए बिल्कुल सही एंडपॉइंट URL
        const API_URL = "https://googleapis.com" + API_KEY;

        async function sendMessage() {
            const inputField = document.getElementById("userInput");
            const chatContainer = document.getElementById("chatContainer");
            const userText = inputField.value.trim();

            if (!userText) return;

            // 3. यूज़र का मैसेज स्क्रीन पर दिखाना
            const userDiv = document.createElement("div");
            userDiv.className = "message user-message";
            userDiv.innerText = userText;
            chatContainer.appendChild(userDiv);
            inputField.value = "";

            // 'सोच रहा हूँ...' वाला टेम्परेरी मैसेज दिखाना
            const aiDiv = document.createElement("div");
            aiDiv.className = "message ai-message";
            aiDiv.innerText = "Flash सोच रहा है... ⚡";
            chatContainer.appendChild(aiDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                // Google API को रिक्वेस्ट भेजना
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: userText }] }]
                    })
                });

                const data = await response.json();

                // 4. नए AQ फॉर्मेट के अनुसार डेटा पासिंग
                if (data && data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0]) {
                    const aiResponse = data.candidates[0].content.parts[0].text;
                    aiDiv.innerText = aiResponse;
                } else {
                    aiDiv.innerText = "कोई प्रतिक्रिया नहीं मिली। कृपया अपनी API Key जांचें या कुछ समय बाद प्रयास करें।";
                    console.log("API Error Details:", data);
                }
            } catch (error) {
                console.error("Network Error:", error);
                aiDiv.innerText = "कनेक्शन एरर! कृपया इंटरनेट कनेक्शन या API Key चेक करें।";
            }

            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
