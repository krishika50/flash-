<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash AI Chatbot</title>
    <style>
        /* Black Background and Global Styles */
        body {
            background-color: #0b0b0f;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Main Chat Container */
        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 80vh;
            background-color: #16161e;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #2a2b36;
        }

        /* Chat Header */
        .chat-header {
            background-color: #1f1f2e;
            padding: 15px 20px;
            font-size: 1.2rem;
            font-weight: bold;
            border-bottom: 1px solid #2a2b36;
            letter-spacing: 1px;
        }

        .chat-header span {
            color: #ffaa00; /* Lightning gold accent for Flash */
        }

        /* Chat History Box */
        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Message Bubbles */
        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 8px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .user-message {
            background-color: #3b3b54;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .flash-message {
            background-color: #222233;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border-left: 3px solid #ffaa00;
        }

        /* Input Bar Container */
        .input-container {
            display: flex;
            padding: 15px;
            background-color: #1f1f2e;
            border-top: 1px solid #2a2b36;
            gap: 10px;
        }

        /* Chat Input Field */
        #user-input {
            flex: 1;
            background-color: #0b0b0f;
            border: 1px solid #3b3b54;
            color: #ffffff;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
        }

        #user-input:focus {
            border-color: #ffaa00;
        }

        /* Send Button */
        #send-btn {
            background-color: #ffaa00;
            color: #0b0b0f;
            border: none;
            padding: 0 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        #send-btn:hover {
            background-color: #e09600;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">⚡ <span>FLASH</span> AI</div>
        
        <!-- Messages appear here -->
        <div class="chat-box" id="chat-box">
            <div class="message flash-message">Hello! I am Flash. How can I help you today?</div>
        </div>

        <!-- Input Section -->
        <div class="input-container">
            <input type="text" id="user-input" placeholder="Ask Flash something..." autocomplete="off">
            <button id="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        // Simulated Fast AI Knowledge Base
        const replies = {
            "hello": "Hello there! Speeding through data to assist you.",
            "hi": "Hey! Flash here. What's on your mind?",
            "how are you": "Running at lightning speed and ready to help!",
            "who are you": "I am Flash, your instant AI assistant built for rapid answers.",
            "what is your name": "My name is Flash!",
            "help": "Tell me what you need, and I will solve it instantly.",
            "default": "That is an interesting question! I am processing it at light speed."
        };

        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');

        // Handle Send Action
        function sendMessage() {
            const text = userInput.value.trim();
            if (text === "") return;

            // 1. Append User Message
            appendMessage(text, 'user-message');
            userInput.value = "";

            // 2. Scroll to bottom
            chatBox.scrollTop = chatBox.scrollHeight;

            // 3. Generate instant Flash reply within 0.4 seconds
            setTimeout(() => {
                const cleanText = text.toLowerCase().replace(/[^\w\s]/gi, '');
                const response = replies[cleanText] || replies["default"];
                
                appendMessage(response, 'flash-message');
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 400); 
        }

        // Helper to add chat bubble
        function appendMessage(text, className) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${className}`;
            messageDiv.innerText = text;
            chatBox.appendChild(messageDiv);
        }

        // Allow sending message with 'Enter' key
        userInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        });
    </script>
</body>
</html>
