<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash AI Chatbot</title>
    <style>
        body {
            background-color: #0b0b0c;
            color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .chat-container {
            width: 440px;
            max-width: 95%;
            height: 650px;
            background-color: #161618;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #2a2a2e;
        }
        .chat-header {
            background-color: #1c1c1e;
            padding: 18px;
            text-align: center;
            font-weight: 700;
            font-size: 1.3rem;
            border-bottom: 1px solid #2a2a2e;
            color: #4e95ff;
            letter-spacing: 1px;
        }
        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.98rem;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .user-message {
            background-color: #2b2b30;
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .bot-message {
            background-color: #1f242e;
            color: #e2e8f0;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border-left: 3px solid #4e95ff;
        }
        .error-message {
            background-color: #3a1c1c;
            color: #ff8888;
            align-self: center;
            font-size: 0.85rem;
            border: 1px solid #5a2c2c;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
        }
        .input-area {
            display: flex;
            padding: 16px;
            background-color: #1c1c1e;
            border-top: 1px solid #2a2a2e;
            gap: 12px;
        }
        #user-input {
            flex: 1;
            background-color: #252529;
            border: 1px solid #3a3a3c;
            color: #ffffff;
            padding: 14px;
            border-radius: 8px;
            outline: none;
            font-size: 0.95rem;
        }
        #user-input:focus {
            border-color: #4e95ff;
        }
        #send-btn {
            background-color: #4e95ff;
            color: #ffffff;
            border: none;
            padding: 0 22px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        #send-btn:hover {
            background-color: #357ae8;
        }
    </style>
    <!-- यह गूगल का ऑफिशियल डायरेक्ट ब्राउज़र मॉड्यूल है जो बिना किसी सर्वर के सीधा काम करेगा -->
    <script type="importmap">
      {
        "imports": {
          "@google/generative-ai": "https://esm.run"
        }
      }
    </script>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">⚡ FLASH AI</div>
        <div class="chat-box" id="chat-box">
            <div class="message bot-message">Hello! I am Flash. Ask me anything like GPT or Gemini!</div>
        </div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Ask Flash something..." autocomplete="off">
            <button id="send-btn">Send</button>
        </div>
    </div>

    <script type="module">
        import { GoogleGenAI } from "@google/generative-ai";

        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        let API_KEY = localStorage.getItem('flash_gemini_key');
        
        if (!API_KEY) {
            API_KEY = prompt("Please enter your official Google Gemini API Key:");
            if (API_KEY) {
                localStorage.setItem('flash_gemini_key', API_KEY.trim());
            }
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            if (!API_KEY) {
                appendMessage("Error: No API key saved. Refresh to enter it.", 'error-message');
                return;
            }

            appendMessage(text, 'user-message');
            userInput.value = '';

            const thinkingId = appendMessage('Flash is typing...', 'bot-message');

            try {
                // सीधे ब्राउज़र से गूगल के नेटवर्क को सुरक्षित रूप से कॉल करना
                const ai = new GoogleGenAI({ apiKey: API_KEY });
                const response = await ai.models.generateContent({
                    model: 'gemini-2.5-flash',
                    contents: text,
                });

                const thinkingElement = document.getElementById(thinkingId);
                if (thinkingElement) thinkingElement.remove();

                if (response && response.text) {
                    appendMessage(response.text, 'bot-message');
                } else {
                    appendMessage("Error reading response.", 'error-message');
                }

            } catch (error) {
                const thinkingElement = document.getElementById(thinkingId);
                if (thinkingElement) thinkingElement.remove();
                appendMessage("API Rejection. Please check your internet or re-paste the correct key.", 'error-message');
                console.error(error);
            }
        }

        function appendMessage(text, className) {
            const msgDiv = document.createElement('div');
            const uniqueId = 'msg-' + Date.now();
            msgDiv.id = uniqueId;
            msgDiv.classList.add('message', className);
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return uniqueId;
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
