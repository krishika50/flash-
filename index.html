<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Flash AI · Intelligent Chatbot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000000;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .chat-app {
            width: 100%;
            max-width: 1100px;
            height: 90vh;
            background: rgba(5, 5, 5, 0.92);
            backdrop-filter: blur(0px);
            border-radius: 2rem;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .chat-header {
            padding: 1.2rem 1.8rem;
            background: rgba(0, 0, 0, 0.7);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .brand {
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .brand h1 {
            font-size: 1.9rem;
            font-weight: 700;
            background: linear-gradient(135deg, #FFFFFF 0%, #a0a0ff 100%);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }

        .badge {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            padding: 0.2rem 0.8rem;
            font-size: 0.7rem;
            font-weight: 500;
            color: #bbbbff;
        }

        .api-config {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            background: rgba(20, 20, 30, 0.7);
            padding: 0.4rem 0.8rem;
            border-radius: 48px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .api-config input {
            background: #111111;
            border: 1px solid #2c2c3a;
            padding: 0.5rem 0.9rem;
            border-radius: 40px;
            font-size: 0.8rem;
            color: #f0f0f0;
            width: 240px;
            outline: none;
            transition: all 0.2s;
        }

        .api-config input:focus {
            border-color: #6c6cff;
            box-shadow: 0 0 0 2px rgba(108, 108, 255, 0.2);
        }

        .api-config button {
            background: #28283b;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 40px;
            color: white;
            font-weight: 500;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .api-config button:hover {
            background: #3e3e5a;
        }

        .key-status {
            font-size: 0.7rem;
            color: #6fcf97;
            background: rgba(111, 207, 151, 0.15);
            padding: 0.2rem 0.6rem;
            border-radius: 30px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem 1.8rem;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            scroll-behavior: smooth;
        }

        .chat-messages::-webkit-scrollbar {
            width: 5px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #3a3a4a;
            border-radius: 10px;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 80%;
            animation: fadeSlideUp 0.25s ease;
        }

        .user-message {
            align-self: flex-end;
        }

        .assistant-message {
            align-self: flex-start;
        }

        .bubble {
            padding: 0.9rem 1.2rem;
            border-radius: 1.8rem;
            line-height: 1.45;
            font-size: 0.95rem;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .user-message .bubble {
            background: linear-gradient(135deg, #20293f, #131a2c);
            color: #f0f3ff;
            border-bottom-right-radius: 0.4rem;
            border: 1px solid rgba(100, 120, 200, 0.2);
        }

        .assistant-message .bubble {
            background: #0e0e16;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #eef2ff;
            border-bottom-left-radius: 0.4rem;
        }

        .message-name {
            font-size: 0.7rem;
            margin-bottom: 0.2rem;
            margin-left: 0.7rem;
            color: #aaaac0;
            letter-spacing: 0.3px;
        }

        .assistant-message .message-name {
            color: #b7adff;
        }

        .typing-indicator {
            display: flex;
            gap: 5px;
            align-items: center;
            padding: 0.6rem 1rem;
            background: #0e0e16;
            border-radius: 2rem;
            width: fit-content;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .typing-indicator span {
            width: 7px;
            height: 7px;
            background: #a0a0ff;
            border-radius: 50%;
            display: inline-block;
            animation: wave 1.2s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(1) { animation-delay: -0.3s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.15s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0s; }

        @keyframes wave {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .input-area {
            background: #050507;
            padding: 1rem 1.5rem 1.4rem;
            border-top: 1px solid rgba(255, 255, 255, 0.07);
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .question-box {
            flex: 1;
            background: #12121a;
            border: 1px solid #2a2a35;
            border-radius: 48px;
            padding: 0.9rem 1.3rem;
            font-size: 1rem;
            font-family: inherit;
            color: #ffffff;
            outline: none;
            transition: all 0.2s;
        }

        .question-box:focus {
            border-color: #6a6aff;
            box-shadow: 0 0 0 2px rgba(106, 106, 255, 0.2);
        }

        .question-box::placeholder {
            color: #6a6a7e;
        }

        .send-btn {
            background: linear-gradient(95deg, #2a2a4a, #1a1a30);
            border: 1px solid rgba(120, 120, 255, 0.5);
            width: 52px;
            height: 52px;
            border-radius: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            color: white;
            font-size: 1.4rem;
            font-weight: 500;
        }

        .send-btn:hover {
            background: linear-gradient(95deg, #3f3f6e, #2a2a55);
            transform: scale(0.97);
            border-color: #9898ff;
        }

        .send-btn:active {
            transform: scale(0.94);
        }

        .action-buttons {
            display: flex;
            gap: 8px;
            margin-left: 6px;
        }

        .icon-btn {
            background: transparent;
            border: 1px solid #2c2c3a;
            color: #ccc;
            border-radius: 40px;
            padding: 0 12px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.2s;
            height: 40px;
            font-weight: 500;
        }

        .icon-btn:hover {
            background: #252535;
            color: white;
            border-color: #6a6aff;
        }

        .footer-note {
            font-size: 0.7rem;
            text-align: center;
            padding: 0.5rem;
            background: #000000cc;
            color: #6e6e88;
            border-top: 1px solid rgba(255,255,255,0.03);
        }

        @media (max-width: 640px) {
            .chat-app {
                height: 95vh;
                border-radius: 1.2rem;
            }
            .message {
                max-width: 92%;
            }
            .api-config input {
                width: 150px;
            }
            .brand h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

<div class="chat-app">
    <div class="chat-header">
        <div class="brand">
            <h1>⚡ FLASH</h1>
            <div class="badge">GPT‑powered AI</div>
        </div>
        <div class="api-config">
            <input type="password" id="apiKeyInput" placeholder="🔑 OpenAI API key" autocomplete="off">
            <button id="saveKeyBtn">Save key</button>
            <span id="keyStatus" class="key-status">⚡ no key</span>
        </div>
    </div>

    <div class="chat-messages" id="chatMessages"></div>

    <div class="input-area">
        <input type="text" id="questionInput" class="question-box" placeholder="Ask anything, I'm Flash..." autocomplete="off">
        <div class="action-buttons">
            <button id="clearChatBtn" class="icon-btn">Clear</button>
        </div>
        <div class="send-btn" id="sendBtn">➤</div>
    </div>
    <div class="footer-note">
        🔮 Flash uses OpenAI (GPT-3.5) · Your key stays in your browser
    </div>
</div>

<script>
    // ---------- FIXED: Clear button now aborts any pending request ----------
    const STORAGE_KEY = "flash_openai_key";
    const CONVERSATION_KEY = "flash_conversation_history";
    const SYSTEM_PROMPT = `You are Flash, a highly intelligent, warm, and creative AI assistant. 
You answer questions clearly, concisely, and with a helpful, positive attitude. 
You have a spark of wit and curiosity. Your name is Flash. You love helping people.
Always respond in the same language as the user. Keep answers informative yet engaging.`;

    let currentApiKey = localStorage.getItem(STORAGE_KEY) || "";
    let conversationHistory = [];
    let isLoading = false;
    let currentAbortController = null;   // <-- to cancel ongoing fetch

    // DOM elements
    const chatContainer = document.getElementById("chatMessages");
    const questionInput = document.getElementById("questionInput");
    const sendButton = document.getElementById("sendBtn");
    const clearChatBtn = document.getElementById("clearChatBtn");
    const apiKeyInput = document.getElementById("apiKeyInput");
    const saveKeyBtn = document.getElementById("saveKeyBtn");
    const keyStatusSpan = document.getElementById("keyStatus");

    function updateKeyStatusUI() {
        if (currentApiKey && currentApiKey.startsWith("sk-") && currentApiKey.length > 20) {
            keyStatusSpan.innerHTML = "🔑 key active";
            keyStatusSpan.style.color = "#a3f0b0";
        } else if (currentApiKey && currentApiKey.length > 0) {
            keyStatusSpan.innerHTML = "⚠️ invalid format";
            keyStatusSpan.style.color = "#ffae70";
        } else {
            keyStatusSpan.innerHTML = "⚡ no key";
            keyStatusSpan.style.color = "#ff8989";
        }
    }

    if (currentApiKey) {
        apiKeyInput.value = currentApiKey;
        updateKeyStatusUI();
    } else {
        updateKeyStatusUI();
    }

    saveKeyBtn.addEventListener("click", () => {
        let newKey = apiKeyInput.value.trim();
        if (newKey) {
            if (newKey.startsWith("sk-") || newKey.length > 30) {
                currentApiKey = newKey;
                localStorage.setItem(STORAGE_KEY, currentApiKey);
                updateKeyStatusUI();
                showSystemMessage("🔐 API key saved. You can now chat with Flash!", 3000);
            } else {
                showSystemMessage("❌ Key should start with 'sk-'", 3500);
            }
        } else {
            currentApiKey = "";
            localStorage.removeItem(STORAGE_KEY);
            updateKeyStatusUI();
            showSystemMessage("🗝️ API key removed. Add a valid key to continue.", 3500);
        }
    });

    let tempTimeout = null;
    function showSystemMessage(text, duration = 3000) {
        const tempDiv = document.createElement("div");
        tempDiv.className = "message assistant-message";
        tempDiv.style.opacity = "0.7";
        tempDiv.style.fontSize = "0.8rem";
        tempDiv.innerHTML = `<div class="bubble" style="background:#1a1a28;">⚡ ${text}</div>`;
        chatContainer.appendChild(tempDiv);
        scrollToBottom();
        if (tempTimeout) clearTimeout(tempTimeout);
        tempTimeout = setTimeout(() => {
            if (tempDiv && tempDiv.remove) tempDiv.remove();
        }, duration);
    }

    function persistConversation() {
        try {
            const toStore = conversationHistory.slice(-100);
            localStorage.setItem(CONVERSATION_KEY, JSON.stringify(toStore));
        } catch(e) {}
    }

    function loadStoredConversation() {
        const stored = localStorage.getItem(CONVERSATION_KEY);
        if (stored) {
            try {
                const parsed = JSON.parse(stored);
                if (Array.isArray(parsed) && parsed.length > 0) {
                    conversationHistory = parsed;
                    renderMessagesFromHistory();
                    return;
                }
            } catch(e) {}
        }
        resetConversation(true);
    }

    function resetConversation(keepWelcome = true) {
        conversationHistory = [];
        if (keepWelcome) {
            const welcomeText = "✨ Hey! I'm **Flash**, your AI companion. Ask me anything — coding, ideas, writing, or just a friendly chat. What's on your mind?";
            addMessageToHistory("assistant", welcomeText);
        }
        renderMessagesFromHistory();
        persistConversation();
    }

    function addMessageToHistory(role, content) {
        conversationHistory.push({ role, content });
        persistConversation();
    }

    function renderMessagesFromHistory() {
        chatContainer.innerHTML = "";
        for (let msg of conversationHistory) {
            appendMessageElement(msg.role, msg.content);
        }
        scrollToBottom();
    }

    function appendMessageElement(role, content) {
        const messageDiv = document.createElement("div");
        messageDiv.className = `message ${role === "user" ? "user-message" : "assistant-message"}`;
        const nameSpan = document.createElement("div");
        nameSpan.className = "message-name";
        nameSpan.innerText = role === "user" ? "You" : "⚡ Flash";
        const bubbleDiv = document.createElement("div");
        bubbleDiv.className = "bubble";
        bubbleDiv.innerText = content;
        messageDiv.appendChild(nameSpan);
        messageDiv.appendChild(bubbleDiv);
        chatContainer.appendChild(messageDiv);
    }

    function scrollToBottom() {
        setTimeout(() => {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }, 50);
    }

    let loadingElement = null;
    function showTypingIndicator() {
        if (loadingElement) return;
        const loaderDiv = document.createElement("div");
        loaderDiv.className = "message assistant-message";
        loaderDiv.id = "typingIndicator";
        loaderDiv.innerHTML = `
            <div class="message-name">⚡ Flash</div>
            <div class="typing-indicator">
                <span></span><span></span><span></span>
            </div>
        `;
        chatContainer.appendChild(loaderDiv);
        scrollToBottom();
        loadingElement = loaderDiv;
    }

    function removeTypingIndicator() {
        if (loadingElement) {
            loadingElement.remove();
            loadingElement = null;
        }
    }

    // ------------------- FIXED: AbortController support -------------------
    async function sendMessageToGPT(userMessage, signal) {
        addMessageToHistory("user", userMessage);
        appendMessageElement("user", userMessage);
        
        const messagesForAPI = [
            { role: "system", content: SYSTEM_PROMPT },
            ...conversationHistory.filter(m => m.role !== "system")
        ];

        try {
            const response = await fetch("https://api.openai.com/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${currentApiKey}`
                },
                body: JSON.stringify({
                    model: "gpt-3.5-turbo",
                    messages: messagesForAPI,
                    temperature: 0.75,
                    max_tokens: 800,
                }),
                signal: signal   // pass abort signal
            });

            if (!response.ok) {
                let errorDetail = `HTTP ${response.status}`;
                try {
                    const errData = await response.json();
                    errorDetail = errData.error?.message || errorDetail;
                } catch(e) {}
                throw new Error(`OpenAI error: ${errorDetail}`);
            }

            const data = await response.json();
            const assistantReply = data.choices[0]?.message?.content?.trim();
            if (!assistantReply) throw new Error("Empty response from AI.");

            addMessageToHistory("assistant", assistantReply);
            appendMessageElement("assistant", assistantReply);
            scrollToBottom();
            return true;

        } catch (err) {
            if (err.name === 'AbortError') {
                console.log("Request cancelled by clear");
                return false;
            }
            let errorMsg = err.message;
            if (errorMsg.includes("Incorrect API key") || errorMsg.includes("invalid_api_key")) {
                errorMsg = "Invalid API key. Please check and re-save.";
                currentApiKey = "";
                localStorage.removeItem(STORAGE_KEY);
                updateKeyStatusUI();
                apiKeyInput.value = "";
            } else if (errorMsg.includes("billing") || errorMsg.includes("quota")) {
                errorMsg = "OpenAI quota exceeded. Check your plan.";
            } else if (errorMsg.includes("rate limit")) {
                errorMsg = "Rate limit reached. Please wait.";
            }
            const fallbackReply = `⚠️ Flash error: ${errorMsg}`;
            addMessageToHistory("assistant", fallbackReply);
            appendMessageElement("assistant", fallbackReply);
            scrollToBottom();
            return false;
        }
    }

    async function handleSendMessage() {
        if (isLoading) {
            showSystemMessage("Flash is thinking... please wait.", 1500);
            return;
        }
        const rawQuestion = questionInput.value.trim();
        if (!rawQuestion) return;
        if (!currentApiKey || !currentApiKey.startsWith("sk-")) {
            showSystemMessage("✨ Please set your OpenAI API key first (top-right field).", 3500);
            return;
        }

        isLoading = true;
        questionInput.value = "";
        questionInput.disabled = true;
        sendButton.style.opacity = "0.6";
        sendButton.style.pointerEvents = "none";
        
        showTypingIndicator();
        
        // Create a new AbortController for this request
        currentAbortController = new AbortController();
        await sendMessageToGPT(rawQuestion, currentAbortController.signal);
        
        currentAbortController = null;
        removeTypingIndicator();
        questionInput.disabled = false;
        sendButton.style.opacity = "1";
        sendButton.style.pointerEvents = "auto";
        questionInput.focus();
        isLoading = false;
    }

    // ------------------- FIXED: Clear button now aborts & resets safely -------------------
    function clearConversation() {
        // If there's an ongoing request, cancel it
        if (currentAbortController) {
            currentAbortController.abort();
            currentAbortController = null;
        }
        // Remove any leftover typing indicator
        removeTypingIndicator();
        // Reset loading flag
        isLoading = false;
        // Re-enable UI elements if they were disabled
        questionInput.disabled = false;
        sendButton.style.opacity = "1";
        sendButton.style.pointerEvents = "auto";
        // Clear the input field
        questionInput.value = "";
        // Reset conversation (keeps welcome message)
        if (conversationHistory.length > 0 && !confirm("Clear all messages? This will reset the conversation.")) {
            return;
        }
        resetConversation(true);
        showSystemMessage("🧹 Conversation cleared. Fresh start with Flash!", 2000);
    }

    sendButton.addEventListener("click", handleSendMessage);
    clearChatBtn.addEventListener("click", clearConversation);
    questionInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            handleSendMessage();
        }
    });

    loadStoredConversation();
    if (conversationHistory.length === 0) resetConversation(true);
    updateKeyStatusUI();
    questionInput.focus();
</script>
</body>
</html>
