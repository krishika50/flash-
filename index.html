<script>
    // ---------- UI ELEMENTS ----------
    const messagesContainer = document.getElementById('chatMessages');
    const userInput = document.getElementById('userInput');
    const sendButton = document.getElementById('sendButton');

    // Enable UI immediately (no model loading)
    userInput.disabled = false;
    sendButton.disabled = false;
    userInput.placeholder = 'Type your message...';
    sendButton.innerHTML = 'Send ⚡';

    // ---------- EVENT LISTENERS ----------
    sendButton.addEventListener('click', handleSend);
    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            handleSend();
        }
    });

    // ---------- SEND HANDLER ----------
    function handleSend() {
        const text = userInput.value.trim();
        if (!text) return;

        addMessage(text, 'user');
        userInput.value = '';
        setInputState(false);

        const typingDiv = document.createElement('div');
        typingDiv.className = 'typing-indicator';
        typingDiv.innerHTML = '<span></span><span></span><span></span>';
        typingDiv.id = 'typingIndicator';
        messagesContainer.appendChild(typingDiv);
        scrollToBottom();

        generateFlashResponse(text)
            .then(responseText => {
                removeTypingIndicator();
                addMessage(responseText, 'bot');
                setInputState(true);
                userInput.focus();
            })
            .catch(err => {
                removeTypingIndicator();
                addMessage('Sorry, something went wrong. Please try again.', 'bot');
                setInputState(true);
                console.error(err);
            });
    }

    // ---------- REAL AI RESPONSE (FREE, NO KEY) ----------
    async function generateFlashResponse(userMessage) {
        try {
            // Use Hugging Face's free, anonymous inference endpoint
            // DialoGPT-medium is conversational (no API key needed)
            const response = await fetch(
                'https://api-inference.huggingface.co/models/microsoft/DialoGPT-medium',
                {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ inputs: userMessage })
                }
            );
            const data = await response.json();
            // Extract the generated text (it usually echoes the prompt, so remove it)
            let reply = data.generated_text || data[0]?.generated_text || '';
            reply = reply.replace(userMessage, '').trim();
            if (!reply) reply = "I'm not sure what to say about that.";
            return reply;
        } catch (err) {
            // Fallback to smart mock if offline or API down
            console.warn('Hugging Face API not reachable, using fallback mock.');
            return fallbackMock(userMessage);
        }
    }

    function fallbackMock(userMessage) {
        const msg = userMessage.toLowerCase();
        const cleaned = msg.replace(/\b(hi|hello|hey|flash|yo)\b/g, '').trim();
        if (cleaned.includes('how are you')) return "I'm doing great, thanks!";
        if (cleaned.includes('your name')) return "I'm Flash, your AI assistant.";
        if (cleaned.includes('time')) return `It's ${new Date().toLocaleTimeString()}.`;
        if (cleaned.includes('joke')) {
            const jokes = ["Why don't scientists trust atoms? Because they make up everything!", "Parallel lines have so much in common. It’s a shame they’ll never meet."];
            return jokes[Math.floor(Math.random() * jokes.length)];
        }
        if (cleaned.length < 3) return "Hey! I'm Flash. How can I help you?";
        return "That's an interesting thought. Can you tell me more?";
    }

    // ---------- UI HELPERS ----------
    function addMessage(text, sender) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${sender === 'user' ? 'user-message' : 'bot-message'}`;
        if (sender === 'bot') {
            messageDiv.innerHTML = `<span class="bot-icon">⚡</span> ${escapeHtml(text)}`;
        } else {
            messageDiv.textContent = text;
        }
        messagesContainer.appendChild(messageDiv);
        scrollToBottom();
    }

    function escapeHtml(text) {
        const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
        return text.replace(/[&<>"']/g, m => map[m]);
    }

    function removeTypingIndicator() {
        const indicator = document.getElementById('typingIndicator');
        if (indicator) indicator.remove();
    }

    function scrollToBottom() {
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function setInputState(enabled) {
        userInput.disabled = !enabled;
        sendButton.disabled = !enabled;
    }
</script>
