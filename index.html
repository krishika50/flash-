<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash - AI Chatbot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Chat container */
        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: #121212;
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(0, 255, 196, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #2a2a2a;
        }

        /* Header */
        .chat-header {
            background: #000;
            color: #00ffc8;
            padding: 16px 20px;
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            border-bottom: 1px solid #2a2a2a;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .chat-header span {
            color: #fff;
            font-weight: 300;
        }

        /* Messages area */
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            background: #0d0d0d;
            scrollbar-width: thin;
            scrollbar-color: #00ffc8 #121212;
        }
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }
        .chat-messages::-webkit-scrollbar-track {
            background: #121212;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: #00ffc8;
            border-radius: 3px;
        }

        /* Message bubbles */
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
            line-height: 1.5;
            animation: fadeIn 0.3s ease;
        }
        .user-message {
            align-self: flex-end;
            background: #1e3a3a;
            color: #e0e0e0;
            border-bottom-right-radius: 4px;
        }
        .bot-message {
            align-self: flex-start;
            background: #2a2a2a;
            color: #f0f0f0;
            border-bottom-left-radius: 4px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .bot-icon {
            font-size: 1.4rem;
        }

        /* Typing indicator */
        .typing-indicator {
            align-self: flex-start;
            background: #2a2a2a;
            padding: 12px 20px;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            color: #aaa;
            display: flex;
            gap: 5px;
        }
        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #00ffc8;
            border-radius: 50%;
            animation: blink 1.4s infinite both;
        }
        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes blink {
            0%, 80%, 100% { opacity: 0.3; transform: scale(0.9); }
            40% { opacity: 1; transform: scale(1.1); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Input area */
        .chat-input-area {
            display: flex;
            padding: 16px;
            background: #000;
            border-top: 1px solid #2a2a2a;
            gap: 10px;
        }
        .chat-input-area input {
            flex: 1;
            padding: 14px 18px;
            border-radius: 30px;
            border: 1px solid #333;
            background: #1a1a1a;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border 0.2s;
        }
        .chat-input-area input:focus {
            border-color: #00ffc8;
        }
        .chat-input-area button {
            background: #00ffc8;
            color: #000;
            border: none;
            padding: 14px 24px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .chat-input-area button:hover {
            background: #00e6b4;
        }
        .chat-input-area button:active {
            transform: scale(0.97);
        }
        .chat-input-area button:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
        }

        /* Flash brand effect */
        .flash-text {
            background: linear-gradient(45deg, #00ffc8, #00a3ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            ⚡ <span class="flash-text">Flash</span> <span>AI</span>
        </div>
        <div class="chat-messages" id="chatMessages">
            <!-- Messages will be inserted here -->
            <div class="message bot-message">
                <span class="bot-icon">⚡</span> Hey! I'm Flash, ready to answer quickly. Ask me anything!
            </div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Type your message..." autocomplete="off" />
            <button id="sendButton">Send ⚡</button>
        </div>
    </div>

    <script>
        // ---------- CONFIGURATION ----------
        // For a real AI backend, replace the generateFlashResponse function with an API call.
        // Example: fetch("https://api.openai.com/v1/chat/completions", { ... })
        // Currently using a fast local mock that simulates quick replies.

        const messagesContainer = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendButton = document.getElementById('sendButton');

        // Add event listeners
        sendButton.addEventListener('click', handleSend);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleSend();
            }
        });

        // Focus input on load
        userInput.focus();

        function handleSend() {
            const text = userInput.value.trim();
            if (!text) return;

            // Display user message
            addMessage(text, 'user');
            userInput.value = '';
            // Disable input/button while "generating"
            setInputState(false);
            
            // Show typing indicator
            const typingDiv = document.createElement('div');
            typingDiv.className = 'typing-indicator';
            typingDiv.innerHTML = '<span></span><span></span><span></span>';
            typingDiv.id = 'typingIndicator';
            messagesContainer.appendChild(typingDiv);
            scrollToBottom();

            // Simulate quick Flash response (replace this with real API call)
            generateFlashResponse(text)
                .then(responseText => {
                    // Remove typing indicator
                    removeTypingIndicator();
                    // Display bot message
                    addMessage(responseText, 'bot');
                    setInputState(true);
                    userInput.focus();
                })
                .catch(err => {
                    removeTypingIndicator();
                    addMessage('Sorry, an error occurred. Please try again.', 'bot');
                    setInputState(true);
                    console.error(err);
                });
        }

        // ---------- MOCK / FAKE FLASH RESPONSE (Replace with actual API) ----------
        async function generateFlashResponse(userMessage) {
            // Simulate network delay: 300-800ms for "quick" answers
            const delay = Math.floor(Math.random() * 500) + 300;
            await new Promise(resolve => setTimeout(resolve, delay));

            // --- Replace this block with a real API call ---
            // Example using OpenAI (requires API key in a secure backend, but for frontend demo you can use fetch if key is exposed – not recommended).
            // const apiKey = 'YOUR_API_KEY';
            // const response = await fetch('https://api.openai.com/v1/chat/completions', {
            //   method: 'POST',
            //   headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
            //   body: JSON.stringify({
            //     model: 'gpt-3.5-turbo',
            //     messages: [{ role: 'user', content: userMessage }],
            //     temperature: 0.7
            //   })
            // });
            // const data = await response.json();
            // return data.choices[0].message.content;

            // Mock responses for demo (quick, varied replies)
            const msg = userMessage.toLowerCase();
            if (msg.includes('hello') || msg.includes('hi')) {
                return "Hey! Flash here. What can I help you with today?";
            } else if (msg.includes('how are you')) {
                return "I'm running at lightning speed! Ready to assist you.";
            } else if (msg.includes('your name') || msg.includes('who are you')) {
                return "I'm Flash, your fast AI assistant. I give quick, concise answers.";
            } else if (msg.includes('time') || msg.includes('date')) {
                return `The current time is ${new Date().toLocaleTimeString()} and date is ${new Date().toLocaleDateString()}.`;
            } else if (msg.includes('weather')) {
                return "I can't fetch live weather data right now, but I'm sure it's sunny somewhere!";
            } else if (msg.includes('joke')) {
                const jokes = [
                    "Why don't scientists trust atoms? Because they make up everything!",
                    "Why did the computer go to the doctor? Because it had a virus!",
                    "What do you call fake spaghetti? An impasta!"
                ];
                return jokes[Math.floor(Math.random() * jokes.length)];
            } else if (msg.length < 5) {
                return "Could you elaborate a bit? I'd love to help with a detailed question!";
            } else {
                // Generic smart-sounding answer
                return `That's an interesting question! Here's a quick thought: based on what you asked about "${userMessage.substring(0, 30)}...", I'd suggest exploring it further with specific details.`;
            }
        }

        // ---------- UI HELPERS ----------
        function addMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender === 'user' ? 'user-message' : 'bot-message'}`;
            if (sender === 'bot') {
                messageDiv.innerHTML = `<span class="bot-icon">⚡</span> ${escapeHtml(text)}`;
            } else {
                messageDiv.textContent = text;
            }
            messagesContainer.appendChild(messageDiv);
            scrollToBottom();
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        }

        function scrollToBottom() {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function setInputState(enabled) {
            userInput.disabled = !enabled;
            sendButton.disabled = !enabled;
            if (enabled) {
                sendButton.textContent = 'Send ⚡';
            } else {
                sendButton.textContent = '...';
            }
        }
    </script>
</body>
</html>
