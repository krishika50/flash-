<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash AI Chatbot</title>
    <style>
        /* Pure Black Theme Styling */
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .chat-container {
            width: 100%;
            max-width: 500px;
            height: 90vh;
            background-color: #0a0a0a;
            border: 1px solid #222222;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.03);
        }

        .chat-header {
            background-color: #111111;
            padding: 15px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 1px;
            border-bottom: 1px solid #222222;
            color: #00ffcc; /* Flash Highlight Color */
        }

        /* Connecting Hugging Chat Interface */
        .ai-frame {
            width: 100%;
            flex: 1;
            border: none;
            background-color: #000000;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">⚡ FLASH AI</div>
        <!-- यह मुफ़्त AI चैटबॉट बिना किसी API Key के काम करेगा -->
        <iframe 
            src="https://huggingface.co" 
            class="ai-frame"
            allow="clipboard-write">
        </iframe>
    </div>

</body>
</html>
