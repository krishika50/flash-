<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash - AI Chatbot (local, no API key)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: #121212;
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(0, 255, 196, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #2a2a2a;
        }

        .chat-header {
            background: #000;
            color: #00ffc8;
            padding: 16px 20px;
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            border-bottom: 1px solid #2a2a2a;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .chat-header span {
            color: #fff;
            font-weight: 300;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            background: #0d0d0d;
            scrollbar-width: thin;
            scrollbar-color: #00ffc8 #121212;
        }
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }
        .chat-messages::-webkit-scrollbar-track {
            background: #121212;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: #00ffc8;
            border-radius: 3px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
            line-height: 1.5;
            animation: fadeIn 0.3s ease;
        }
        .user-message {
            align-self: flex-end;
            background: #1e3a3a;
            color: #e0e0e0;
            border-bottom-right-radius: 4px;
        }
        .bot-message {
            align-self: flex-start;
            background: #2a2a2a;
            color: #f0f0f0;
            border-bottom-left-radius: 4px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .bot-icon {
            font-size: 1.4rem;
        }

        .typing-indicator {
            align-self: flex-start;
            background: #2a2a2a;
            padding: 12px 20px;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            color: #aaa;
            display: flex;
            gap: 5px;
        }
        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #00ffc8;
            border-radius: 50%;
            animation: blink 1.4s infinite both;
        }
        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes blink {
            0%, 80%, 100% { opacity: 0.3; transform: scale(0.9); }
            40% { opacity: 1; transform: scale(1.1); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chat-input-area {
            display: flex;
            padding: 16px;
            background: #000;
            border-top: 1px solid #2a2a2a;
            gap: 10px;
        }
        .chat-input-area input {
            flex: 1;
            padding: 14px 18px;
            border-radius: 30px;
            border: 1px solid #333;
            background: #1a1a1a;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border 0.2s;
        }
        .chat-input-area input:focus {
            border-color: #00ffc8;
        }
        .chat-input-area button {
            background: #00ffc8;
            color: #000;
            border: none;
            padding: 14px 24px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .chat-input-area button:hover {
            background: #00e6b4;
        }
        .chat-input-area button:active {
            transform: scale(0.97);
        }
        .chat-input-area button:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
        }

        .flash-text {
            background: linear-gradient(45deg, #00ffc8, #00a3ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            ⚡ <span class="flash-text">Flash</span> <span>AI</span>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="message bot-message">
                <span class="bot-icon">⚡</span> Hey! I'm Flash, your local AI. I'm loading my brain… please wait a moment.
            </div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="AI is loading…" autocomplete="off" disabled />
            <button id="sendButton" disabled>⚡</button>
        </div>
    </div>

    <script type="module">
        import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';

        // ---------- UI ELEMENTS ----------
        const messagesContainer = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendButton = document.getElementById('sendButton');

        // ---------- STATE ----------
        let aiGenerator = null;          // will hold the Transformers.js pipeline
        let aiReady = false;

        // ---------- INITIALISE AI ----------
        async function loadAI() {
            try {
                // Load the instruction-tuned model (about 300 MB, cached after first download)
                aiGenerator = await pipeline('text-generation', 'Xenova/LaMini-Flan-T5-783M');
                aiReady = true;

                // Enable UI
                userInput.disabled = false;
                sendButton.disabled = false;
                userInput.placeholder = 'Type your message...';
                sendButton.innerHTML = 'Send ⚡';
                userInput.focus();

                // Update the initial bot message
                messagesContainer.innerHTML = '';
                addMessage("I'm ready! Ask me anything. I'm a real AI running directly in your browser.", 'bot');
            } catch (err) {
                console.error('AI loading failed:', err);
                // Keep the mock fallback enabled anyway
                userInput.disabled = false;
                sendButton.disabled = false;
                userInput.placeholder = 'Type your message...';
                sendButton.innerHTML = 'Send ⚡';
                addMessage("⚠️ Couldn't load the AI model. I'll use a basic fallback instead.", 'bot');
            }
        }

        // ---------- EVENT LISTENERS ----------
        sendButton.addEventListener('click', handleSend);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });

        // ---------- SEND HANDLER ----------
        function handleSend() {
            const text = userInput.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            userInput.value = '';
            setInputState(false);

            // Show typing dots
            const typingDiv = document.createElement('div');
            typingDiv.className = 'typing-indicator';
            typingDiv.innerHTML = '<span></span><span></span><span></span>';
            typingDiv.id = 'typingIndicator';
            messagesContainer.appendChild(typingDiv);
            scrollToBottom();

            generateFlashResponse(text)
                .then(responseText => {
                    removeTypingIndicator();
                    addMessage(responseText, 'bot');
                    setInputState(true);
                    userInput.focus();
                })
                .catch(err => {
                    removeTypingIndicator();
                    addMessage('Sorry, something went wrong. Please try again.', 'bot');
                    setInputState(true);
                    console.error(err);
                });
        }

        // ---------- RESPONSE GENERATION ----------
        async function generateFlashResponse(userMessage) {
            // If AI is loaded, use it
            if (aiReady && aiGenerator) {
                try {
                    const prompt = `User: ${userMessage}\nAssistant:`;
                    const result = await aiGenerator(prompt, {
                        max_new_tokens: 150,
                        temperature: 0.7,
                        do_sample: true,
                    });
                    // Extract the assistant's reply (remove the prompt)
                    let fullText = result[0].generated_text;
                    let reply = fullText.replace(prompt, '').trim();
                    if (!reply) reply = "I'm not sure what to say about that.";
                    return reply;
                } catch (err) {
                    console.error('AI generation error:', err);
                    // Fallback to mock
                }
            }

            // ----- FALLBACK MOCK (used when AI not loaded or error) -----
            const msg = userMessage.toLowerCase();
            const cleanedMsg = msg.replace(/\b(hi|hello|hey|flash|yo|good\s?(morning|afternoon|evening))\b/g, '').trim();

            if (cleanedMsg.length > 2) {
                if (cleanedMsg.includes('how are you')) return "I'm running at lightning speed! Ready to assist you.";
                if (cleanedMsg.includes('your name') || cleanedMsg.includes('who are you')) return "I'm Flash, your fast AI assistant.";
                if (cleanedMsg.includes('time') || cleanedMsg.includes('date'))
                    return `The current time is ${new Date().toLocaleTimeString()} and date is ${new Date().toLocaleDateString()}.`;
                if (cleanedMsg.includes('weather')) return "I can't fetch live weather, but I hope it's nice where you are!";
                if (cleanedMsg.includes('joke')) {
                    const jokes = [
                        "Why don't scientists trust atoms? Because they make up everything!",
                        "Why did the computer go to the doctor? Because it had a virus!",
                        "What do you call fake spaghetti? An impasta!"
                    ];
                    return jokes[Math.floor(Math.random() * jokes.length)];
                }
                return `That's an interesting question! Based on "${userMessage.substring(0, 30)}...", I'd suggest exploring it further.`;
            }

            if (msg.includes('hello') || msg.includes('hi') || msg.includes('hey'))
                return "Hey! Flash here. What can I help you with today?";
            return "Could you elaborate a bit? I'd love to help!";
        }

        // ---------- UI HELPERS (unchanged) ----------
        function addMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender === 'user' ? 'user-message' : 'bot-message'}`;
            if (sender === 'bot') {
                messageDiv.innerHTML = `<span class="bot-icon">⚡</span> ${escapeHtml(text)}`;
            } else {
                messageDiv.textContent = text;
            }
            messagesContainer.appendChild(messageDiv);
            scrollToBottom();
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        }

        function scrollToBottom() {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function setInputState(enabled) {
            userInput.disabled = !enabled;
            sendButton.disabled = !enabled;
            if (enabled) {
                sendButton.innerHTML = 'Send ⚡';
            } else {
                sendButton.innerHTML = '⚡';
            }
        }

        // ---------- START ----------
        loadAI();
    </script>
</body>
</html>
