```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flash AI</title>

<style>
body{
    margin:0;
    background:#000;
    font-family:Arial,sans-serif;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.chat-container{
    width:450px;
    height:650px;
    background:#111;
    border-radius:15px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

.header{
    background:#00c896;
    color:black;
    text-align:center;
    padding:15px;
    font-size:24px;
    font-weight:bold;
}

.chat-box{
    flex:1;
    overflow-y:auto;
    padding:15px;
}

.message{
    margin:10px 0;
    padding:10px;
    border-radius:10px;
}

.user{
    background:#00c896;
    color:black;
    text-align:right;
}

.bot{
    background:#222;
}

.input-area{
    display:flex;
    padding:10px;
    background:#181818;
}

input{
    flex:1;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#222;
    color:white;
}

button{
    margin-left:10px;
    padding:12px 18px;
    border:none;
    border-radius:8px;
    background:#00c896;
    cursor:pointer;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="chat-container">

<div class="header">⚡ Flash AI</div>

<div class="chat-box" id="chatBox"></div>

<div class="input-area">
<input type="text" id="userInput" placeholder="Ask Flash AI...">
<button onclick="sendMessage()">Send</button>
</div>

</div>

<script>

const API_KEY = "YOUR_API_KEY";

async function sendMessage() {

    const input = document.getElementById("userInput");
    const chatBox = document.getElementById("chatBox");

    const text = input.value.trim();

    if(!text) return;

    chatBox.innerHTML += `
      <div class="message user">${text}</div>
    `;

    input.value = "";

    try {

        const response = await fetch(
          "https://api.openai.com/v1/chat/completions",
          {
            method:"POST",
            headers:{
              "Content-Type":"application/json",
              "Authorization":"Bearer " + API_KEY
            },
            body:JSON.stringify({
              model:"gpt-4o-mini",
              messages:[
                {
                  role:"system",
                  content:"You are Flash AI, a smart assistant."
                },
                {
                  role:"user",
                  content:text
                }
              ]
            })
          }
        );

        const data = await response.json();

        const reply =
          data.choices?.[0]?.message?.content ||
          "No response received.";

        chatBox.innerHTML += `
          <div class="message bot">${reply}</div>
        `;

        chatBox.scrollTop = chatBox.scrollHeight;

    } catch(error) {

        chatBox.innerHTML += `
          <div class="message bot">
            Error connecting to AI service.
          </div>
        `;

        console.error(error);
    }
}

document
.getElementById("userInput")
.addEventListener("keypress", function(e){
    if(e.key==="Enter"){
        sendMessage();
    }
});

</script>

</body>
</html>
```
