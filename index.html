<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash Chatbot</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        #chatbox {
            width: 300px;
            height: 400px;
            border: 1px solid #ccc;
            padding: 10px;
            overflow-y: scroll;
            background-color: #222;
        }
        #userInput {
            width: 300px;
            padding: 10px;
        }
        #sendButton {
            padding: 10px;
        }
    </style>
</head>
<body>
    <div id="chatbox"></div>
    <input type="text" id="userInput" placeholder="Type your message...">
    <button id="sendButton">Send</button>

    <script>
        const chatbox = document.getElementById('chatbox');
        const userInput = document.getElementById('userInput');
        const sendButton = document.getElementById('sendButton');

        sendButton.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        async function sendMessage() {
            const message = userInput.value;
            if (message.trim() === '') return;

            // Display user's message
            chatbox.innerHTML += `<div>You: ${message}</div>`;
            userInput.value = '';

            // Get bot response from API
            const response = await getBotResponse(message);
            chatbox.innerHTML += `<div>Flash: ${response}</div>`;
            chatbox.scrollTop = chatbox.scrollHeight;  // Auto-scroll
        }

        async function getBotResponse(message) {
            const response = await fetch("YOUR_API_ENDPOINT", {  // Replace with your API endpoint
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer YOUR_API_KEY"  // Replace with your actual API key
                },
                body: JSON.stringify({ prompt: message, max_tokens: 100 })  // Adjust according to API requirements
            });

            const data = await response.json();
            return data.choices[0].text.trim();  // Modify according to API response structure
        }
    </script>
</body>
</html>
