<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash AI Chatbot</title>
    <style>
        /* Modern Dark Theme */
        body {
            background-color: #0d0e12;
            color: #f1f2f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Responsive Layout Container */
        .chat-container {
            width: 90%;
            max-width: 550px;
            height: 85vh;
            background-color: #171923;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #2d3748;
        }

        /* Branding Header */
        .chat-header {
            background-color: #1a202c;
            padding: 18px 24px;
            font-size: 1.25rem;
            font-weight: 700;
            border-bottom: 1px solid #2d3748;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-header span {
            color: #ecc94b; /* Flash Bolt Gold Accent */
        }

        /* Message Display Screen */
        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background-color: #171923;
        }

        /* Message Presentation */
        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            word-wrap: break-word;
            font-size: 0.95rem;
        }

        .user-message {
            background-color: #3182ce;
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .flash-message {
            background-color: #2d3748;
            color: #edf2f7;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border-left: 4px solid #ecc94b;
        }

        /* Input Interaction Deck */
        .input-container {
            display: flex;
            padding: 16px;
            background-color: #1a202c;
            border-top: 1px solid #2d3748;
            gap: 12px;
        }

        /* Text Input Field */
        #user-input {
            flex: 1;
            background-color: #0d0e12;
            border: 1px solid #4a5568;
            color: #ffffff;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        #user-input:focus {
            border-color: #ecc94b;
        }

        /* Action Send Button */
        #send-btn {
            background-color: #ecc94b;
            color: #1a202c;
            border: none;
            padding: 0 24px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        #send-btn:hover {
            background-color: #d69e2e;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">⚡ <span>FLASH</span> AI</div>
        
        <div class="chat-box" id="chat-box">
            <div class="message flash-message">Hello! I am Flash. Ask me anything, and I will answer at lightning speed!</div>
        </div>

        <div class="input-container">
            <input type="text" id="user-input" placeholder="Type your message here..." autocomplete="off">
            <button id="send-btn">Send</button>
        </div>
    </div>

    <script>
        // Pre-configured Intelligent Responses
        const knowledgeBase = {
            "hello": "Hello! Flash here, ready to run calculations for you.",
            "hi": "Hi there! What can I generate for you instantly?",
            "how are you": "Systems optimized and running at maximum processing capacity!",
            "who are you": "I am Flash, your highly responsive custom AI companion.",
            "what is your name": "My creators named me Flash because I reply in milliseconds.",
            "help": "State your problem clearly, and I will parse it right away."
        };

        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        // Main Core Execution Function
        function processChat() {
            const rawText = userInput.value;
            const cleanText = rawText.trim();
            
            if (cleanText === "") return;

            // 1. Instantly render User UI Bubble
            appendBubble(cleanText, 'user-message');
            userInput.value = ""; // Clear input immediately
            autoScroll();

            // 2. Compute and trigger simulated AI response
            setTimeout(() => {
                const searchKey = cleanText.toLowerCase().replace(/[^\w\s]/gi, '');
                const aiReply = knowledgeBase[searchKey] || "Processing complete. That is an excellent question! I am ready to process more logs.";
                
                appendBubble(aiReply, 'flash-message');
                autoScroll();
            }, 300); // 0.3 Second Delay
        }

        // Helper: Inject Elements safely into DOM
        function appendBubble(text, computationalClass) {
            const bubble = document.createElement('div');
            bubble.className = `message ${computationalClass}`;
            bubble.textContent = text; // Prevents HTML injection attacks
            chatBox.appendChild(bubble);
        }

        // Helper: Maintenance View Window Scroll
        function autoScroll() {
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Event Binding Layer (Guarantees execution)
        sendBtn.addEventListener('click', processChat);

        userInput.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                processChat();
            }
        });
    </script>
</body>
</html>
